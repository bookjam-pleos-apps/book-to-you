# ngrok → 이 서버(:8080) → /v1은 api:3000, 나머지는 부모 웹 정적 파일.
# location 안에 add_header가 하나라도 있으면 바깥 add_header를 물려받지 않아, 보안 헤더는 location마다 include한다.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # api 컨테이너가 다시 뜨면 IP가 바뀐다. 시작할 때 한 번만 풀면 죽은 IP로 계속 보낸다.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /v1/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # ngrok이 실제 접속 IP를 맨 오른쪽에 붙이고, API(TRUST_PROXY)는 맨 오른쪽 값만 믿는다.
    # 여기서 덧붙이면 모든 요청이 ngrok 컨테이너 IP 하나로 보여 IP당 제한이 전체에 걸린다.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 업로드 상한(POLICY.upload.maxBytes 25MiB)과 multipart 여유. 넘는 판정은 API가 한다.
    client_max_body_size 26m;
    # 업로드 직후 받아쓰기 검사가 요청 안에서 최대 60초 돈다.
    proxy_read_timeout 120s;
    # 오디오(수 MB)를 임시 파일에 쓰지 않고 바로 흘려보낸다.
    proxy_max_temp_file_size 0;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # 빌드 파일 이름에 해시가 들어 있어 오래 캐시해도 된다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # 화면 경로는 모두 index.html로 보내 앱 라우터가 고른다. 새 배포가 바로 보이게 캐시하지 않는다.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
