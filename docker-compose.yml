services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env를 만드세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env를 만드세요}
      POSTGRES_DB: ${POSTGRES_DB:?.env를 만드세요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # 공식 minio/minio 이미지가 Docker Hub와 quay.io에서 조회되지 않아 Chainguard 빌드를 쓴다.
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?.env를 만드세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?.env를 만드세요}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
