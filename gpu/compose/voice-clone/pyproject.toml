[project]
name = "voice-clone-service"
version = "0.1.0"
description = "model-compose voice-clone 서비스 환경"
requires-python = ">=3.12,<3.13"
dependencies = [
    "model-compose @ git+https://github.com/rn1njoo/model-compose@462e13006f64dbb6ed788341e57dec4bc522f49f",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "accelerate==1.12.0",
    # model-compose는 +cu 태그가 없는 torch를 다른 버전으로 재설치한다. 태그가 붙은 휠로 잠가야 스파이크와 같은 버전이 유지된다.
    "torch==2.14.1",
    "torchaudio==2.11.0",
    # 드라이버가 기동할 때 설치하는 패키지다. 미리 잠가 두어 lock 밖 버전이 들어오지 않게 한다.
    "fastapi",
    "uvicorn",
    "python-multipart",
    "huggingface-hub",
    "numpy",
    "soundfile",
    "peft",
    "torchcodec",
    # transcribe-long의 Silero VAD 드라이버가 기동할 때 설치한다.
    "silero-vad",
    "soxr",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# RTX 4090 장비의 드라이버(575)는 CUDA 12.9까지만 지원해 cu130 휠을 쓸 수 없다.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
