# 인증이 없고 경로 입력을 검증하지 않는다. 믿을 수 있는 네트워크에만 연다.
controller:
  # 렌더 한 편이 슬롯 둘을 쓰고, 남은 하나로 렌더 중에도 녹음 확인이 돈다.
  max_concurrent_count: 3
  adapter:
    type: http-server
    # 주소와 포트는 환경변수로 바꾼다.
    host: ${env.SERVICE_HOST | 127.0.0.1}
    port: ${env.SERVICE_PORT | 18090}
    base_path: /api

workflows:
  - id: prepare-reference
    title: Prepare clone reference
    job:
      component: reference-ffmpeg

  - id: clone-sentence
    title: Clone one sentence
    job:
      component: qwen-clone

  - id: transcribe
    title: Transcribe a clip up to 30 seconds
    job:
      component: whisper

  # 부모가 올린 녹음 하나를 받아쓰고 음높이·말한 시간을 잰다. 판정은 API가 한다.
  # 두 단계는 차례로 돈다. 동시에 돌리면 업로드 하나를 나눠 읽어 음성이 잘린다.
  # 입력: audio_path. 출력: {transcript, measure: {voicedSeconds, medianSemitones}}
  - id: check-clip
    title: Transcribe a recording and measure its pitch and pace
    jobs:
      - id: transcribe
        component: whisper
        input:
          audio_path: ${input.audio_path}

      - id: measure
        component: voice-measure
        input:
          audio_path: ${input.audio_path}
        depends_on: [ transcribe ]
    output:
      transcript: ${jobs.transcribe.output}
      measure: ${jobs.measure.output}

  # Whisper는 30초 창 하나만 들어서, 긴 입력은 VAD로 30초 이하 구간을 나눠 받아쓴다.
  # 원고로 오인식을 고치지 않는다. 고치면 받아쓰기 QC가 의미를 잃는다.
  - id: transcribe-long
    title: Transcribe a clip longer than 30 seconds
    jobs:
      - id: detect
        component: vad
        input:
          audio_path: ${input.audio_path}

      - id: clip
        component: clipper
        input:
          audio_path: ${input.audio_path}
          spans: ${jobs.detect.output}
        depends_on: [ detect ]

      - id: transcribe
        type: for-each
        input: ${jobs.clip.output}
        do:
          component: whisper
          input:
            audio_path: ${item}
        # clipper는 항상 스트림을 돌려준다. JSON 이벤트로 받아야 구간별 받아쓰기가 구분된다.
        output: ${output as stream/json}
        depends_on: [ clip ]

  # 동화 단위 하나를 렌더한다. 시도를 최대 3번 반복하고 판단은 spike.run_render_step이 한다.
  # 입력: job_dir, unit_index. 출력: {done, passed, attempts, chosen_attempt}
  - id: render-unit
    title: Render one story unit with retries
    jobs:
      - id: attempts
        type: loop
        input: ${input}
        do:
          component: render-attempt-flow
          input:
            job_dir: ${input.job_dir}
            unit_index: ${input.unit_index}
            attempt: ${iteration}
        # loop는 최대 횟수에 닿으면 에러를 낸다. 마지막 시도에서는 qc가 done=true를 돌려주므로 그 전에 멈춘다.
        until:
          input: ${output.done}
          operator: eq
          value: true
        max_iteration_count: 3

  - id: render-attempt
    title: Render one attempt of a story unit
    jobs:
      - id: spec
        component: render-spec
        input: ${input}

      - id: clone
        component: qwen-clone
        input:
          text: ${jobs.spec.output.text}
          reference_path: ${jobs.spec.output.reference_path}
          reference_text: ${jobs.spec.output.reference_text}
          seed: ${jobs.spec.output.seed}
          max_new_tokens: ${jobs.spec.output.max_new_tokens}
        depends_on: [ spec ]

      - id: save
        component: render-save
        input:
          job_dir: ${input.job_dir}
          unit_index: ${input.unit_index}
          attempt: ${input.attempt}
          audio: ${jobs.clone.output}
        depends_on: [ clone ]

      - id: take
        component: render-take-flow
        input:
          job_dir: ${input.job_dir}
          unit_index: ${input.unit_index}
          attempt: ${input.attempt}
          tail_clips: ${jobs.save.output.tail_clips}
        depends_on: [ save ]

  # 저장한 시도 하나의 뒤처리. 꼬리를 자르고 받아써서 판정한다. render-batch도 같은 판단을 쓴다.
  # 입력: job_dir, unit_index, attempt, tail_clips(save의 출력). 출력: qc와 같다({done, passed, attempts, chosen_attempt}).
  - id: render-take
    title: Cut, transcribe and judge one saved attempt
    jobs:
      # 낱말 꼬리를 붙인 단위만 조각이 있다. 없으면 빈 목록이다.
      - id: tail
        type: for-each
        input: ${input.tail_clips}
        do:
          component: whisper
          input:
            audio_path: ${item}

      - id: cut
        component: render-cut
        input:
          job_dir: ${input.job_dir}
          unit_index: ${input.unit_index}
          attempt: ${input.attempt}
          texts: ${jobs.tail.output}
        depends_on: [ tail ]

      - id: detect
        component: vad
        input:
          audio_path: ${jobs.cut.output.audio_path}
        depends_on: [ cut ]

      - id: segments
        component: render-segments
        input:
          job_dir: ${input.job_dir}
          unit_index: ${input.unit_index}
          attempt: ${input.attempt}
          vad: ${jobs.detect.output}
        depends_on: [ detect ]

      - id: transcribe
        type: for-each
        input: ${jobs.segments.output}
        do:
          component: whisper
          input:
            audio_path: ${item}
        depends_on: [ segments ]

      - id: qc
        component: render-qc
        input:
          job_dir: ${input.job_dir}
          unit_index: ${input.unit_index}
          attempt: ${input.attempt}
          texts: ${jobs.transcribe.output}
        depends_on: [ transcribe ]

  # 같은 style 단위 여러 개를 한 번에 생성한다. 배치 계획은 spike.render.batch.render_rounds가 한다.
  # 입력: job_dir, unit_indices(JSON 목록), attempt. 생성음과 단위는 보낸 순서로 짝짓는다.
  - id: render-batch
    title: Render one attempt of several story units in one batch
    jobs:
      - id: spec
        component: render-batch-spec
        input: ${input}

      - id: clone
        component: qwen-clone
        action: clone-batch
        input:
          texts: ${jobs.spec.output.texts}
          batch_size: ${jobs.spec.output.batch_size}
          reference_path: ${jobs.spec.output.reference_path}
          reference_text: ${jobs.spec.output.reference_text}
          seed: ${jobs.spec.output.seed}
          max_new_tokens: ${jobs.spec.output.max_new_tokens}
        depends_on: [ spec ]

      - id: save
        type: for-each
        input:
          "&":
            unit: ${jobs.spec.output.units}
            audio: ${jobs.clone.output as audio[]/wav}
        do:
          component: render-save
          input:
            job_dir: ${item.unit.job_dir}
            unit_index: ${item.unit.unit_index}
            attempt: ${item.unit.attempt}
            audio: ${item.audio}
        depends_on: [ clone ]

      # whisper는 하나씩 디코딩한다(batch_size 1). 묶으면 GB10에서 오히려 느렸다.
      - id: tails
        component: render-batch-step
        input:
          step: tails
          job_dir: ${input.job_dir}
          unit_indices: ${input.unit_indices}
          attempt: ${input.attempt}
        depends_on: [ save ]

      - id: tail-texts
        component: whisper
        input:
          audio_path: ${jobs.tails.output.paths}
          batch_size: 1
        depends_on: [ tails ]

      - id: cut
        component: render-batch-step
        input:
          step: cut
          job_dir: ${input.job_dir}
          unit_indices: ${input.unit_indices}
          attempt: ${input.attempt}
          texts: ${jobs.tail-texts.output}
        depends_on: [ tail-texts ]

      - id: detect
        type: for-each
        input: ${jobs.cut.output.long}
        do:
          component: vad
          input:
            audio_path: ${item}
        depends_on: [ cut ]

      - id: segments
        component: render-batch-step
        input:
          step: segments
          job_dir: ${input.job_dir}
          unit_indices: ${input.unit_indices}
          attempt: ${input.attempt}
          vad: ${jobs.detect.output}
        depends_on: [ detect ]

      - id: transcribe
        component: whisper
        input:
          audio_path: ${jobs.segments.output.paths}
          batch_size: 1
        depends_on: [ segments ]

      - id: qc
        component: render-batch-step
        input:
          step: qc
          job_dir: ${input.job_dir}
          unit_indices: ${input.unit_indices}
          attempt: ${input.attempt}
          texts: ${jobs.transcribe.output}
        depends_on: [ transcribe ]

  # 작업 폴더 묶음(tar)을 받아 동화 한 편을 렌더한다.
  # 비동기로 부르고 task를 조회한다. 결과는 작업 폴더에 남기고 render-result로 받는다.
  # 입력: job_id(렌더 id, 소문자 UUID), bundle(tar 업로드). 출력: {units, failed}
  # 배치 엔진의 목소리 확인이 HTTP로 부른다. 지우면 렌더가 끝에서 실패한다.
  - id: voice-embed
    title: Speaker embeddings of rendered units and references
    job:
      component: voice-embed
      input: ${input}

  - id: render-story
    title: Unpack a render job bundle and render the whole story
    job:
      component: render-story
      input: ${input}

  # 렌더 결과(out/report.json, out/story.wav)를 tar 하나로 돌려준다.
  # 파일 출력은 비동기 task로 받을 수 없어 동기로 부른다.
  # 입력: job_id
  - id: render-result
    title: Return the rendered story of a job as a tar
    jobs:
      - id: pack
        component: render-pack
        input: ${input}
    output: ${jobs.pack.output.path as file;path}

  # 작업 폴더(부모 음성 포함)를 지운다. 성공·실패와 관계없이 워커가 부른다.
  # 입력: job_id. 출력: {removed}
  - id: render-cleanup
    title: Remove the job folder of a render
    job:
      component: render-cleanup
      input: ${input}

components:
  - id: reference-ffmpeg
    type: shell
    max_concurrent_count: 1
    action:
      # spike.clone.reference.ref_prep과 같은 인자다. test_compose_files가 일치를 확인한다.
      command:
        - ffmpeg
        - -y
        - -loglevel
        - error
        - -i
        # `file:`은 URL 입력과 `-`로 시작하는 경로가 옵션으로 해석되는 것을 막는다.
        - file:${input.source_path}
        - -af
        - silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.05,areverse,silenceremove=start_periods=1:start_threshold=-45dB:start_silence=0.05,areverse,loudnorm=I=-20:TP=-2:LRA=11,apad=pad_dur=0.5
        - -ac
        - "1"
        - -ar
        - "24000"
        - -c:a
        - pcm_s16le
        - file:${input.output_path}
      timeout: 60s

  - id: qwen-clone
    type: model
    task: text-to-speech
    driver: custom
    family: qwen
    model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    device: cuda:0
    # 첫 요청이 모델을 올린다. QWEN_IDLE_TIMEOUT을 주면 쉬는 동안 내린다.
    preload: false
    on_demand:
      idle_timeout: ${env.QWEN_IDLE_TIMEOUT | 0}
    # GB10은 flash-attn을 빌드할 수 없다.
    attn_implementation: sdpa
    max_concurrent_count: 1
    actions:
      - id: clone
        default: true
        method: clone
        text: ${input.text}
        language: ko
        # `file;path`로 받아야 음성을 임시 파일로 복사하지 않는다.
        reference_audio: ${input.reference_path as file;path}
        reference_text: ${input.reference_text}
        seed: ${input.seed}
        # 끄면 말 속도가 빨라진다.
        non_streaming_mode: true
        max_new_tokens: ${input.max_new_tokens}
        temperature: ${input.temperature}
        subtalker_temperature: ${input.temperature}
        output: ${result as audio/wav}

      # 같은 참조로 여러 문장을 한 번에 만든다. seed는 배치 전체에 한 번 걸리고, 결과는 보낸 순서의 음성 목록이다.
      - id: clone-batch
        method: clone
        text: ${input.texts}
        batch_size: ${input.batch_size}
        language: ko
        reference_audio: ${input.reference_path as file;path}
        reference_text: ${input.reference_text}
        seed: ${input.seed}
        non_streaming_mode: true
        max_new_tokens: ${input.max_new_tokens}

  - id: vad
    type: model
    task: voice-activity-detection
    driver: custom
    family: silero
    device: cpu
    max_concurrent_count: 1
    # whisper와 같은 이유로 별도 프로세스에서 읽는다.
    runtime:
      type: process
    action:
      audio: ${input.audio_path as file;path}
      # Silero는 8kHz와 16kHz만 받는다.
      sample_rate: 16000
      streaming: false
      params:
        threshold: 0.5
        min_speech_duration: 250ms
        # Whisper 창을 넘는 구간이 나오지 않도록 자른다.
        max_speech_duration: 30s
        min_silence_duration: 500ms
        speech_padding_time: 100ms
      # 비스트리밍 결과는 {segments: [...]}다. 그대로 넘기면 clipper가 구간 하나로 읽는다.
      output: ${result.segments}

  - id: clipper
    type: audio-clipper
    driver: ffmpeg
    action:
      audio: ${input.audio_path as file;path}
      span: ${input.spans}
      return_timestamp: false

  - id: whisper
    type: model
    task: speech-to-text
    driver: huggingface
    architecture: whisper
    model: openai/whisper-large-v3
    device: cuda:0
    # Qwen과 같다(WHISPER_IDLE_TIMEOUT).
    preload: false
    on_demand:
      idle_timeout: ${env.WHISPER_IDLE_TIMEOUT | 0}
    precision: float16
    max_concurrent_count: 1
    # Qwen과 같은 프로세스에서 읽으면 meta tensor 오류가 난다. 별도 프로세스로 띄운다.
    runtime:
      type: process
    action:
      audio: ${input.audio_path as file;path}
      # 경로 목록을 주면 batch_size개씩 받아쓴다.
      batch_size: ${input.batch_size as integer | 1}
      language: korean
      task: transcribe
      params:
        # 드라이버 기본값은 1이다. 스파이크 파이프라인의 5에 맞춘다.
        num_beams: 5

  # render-attempt의 단계. spike.run_render_step을 SPIKE_PYTHON(spike 환경의 파이썬)으로 부른다.
  # 실행 파일은 서비스 환경변수로만 정한다. 요청으로 받으면 아무 프로그램이나 실행할 수 있다.
  # 실패하면 stdout이 비어 워크플로우가 멈춘다. shell은 종료 코드로 실패하지 않는다.
  # 리스트는 `as text`(JSON 문자열)로 넘긴다. 그대로 넣으면 요소마다 명령이 돈다.
  - id: render-spec
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_step, spec, "--job=${input.job_dir}", "--unit=${input.unit_index}", "--attempt=${input.attempt}" ]
      timeout: 60s
      output: ${result.stdout as json}

  # torch·speechbrain이 있는 spike 환경이 필요하다. GPU는 Qwen과 whisper가 쓰므로 CPU로 잰다.
  - id: voice-embed
    type: shell
    action:
      command: [ "${env.SPIKE_VOICE_PYTHON | spike-voice-python-not-set}", -m, spike.run_voice_embed, "--paths=${input.paths as text}", --device=cpu ]
      timeout: 300s
      output: ${result.stdout as json}

  # render-batch의 뒤처리 단계. step은 워크플로우가 고정값으로 넣는다(tails, cut, segments, qc).
  - id: render-batch-step
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_batch_step, "${input.step}", "--job=${input.job_dir}", "--units=${input.unit_indices as text}", "--attempt=${input.attempt}", "--texts=${input.texts as text | []}", "--vad=${input.vad as text | []}" ]
      timeout: 300s
      output: ${result.stdout as json}

  - id: render-batch-spec
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_batch_step, spec, "--job=${input.job_dir}", "--units=${input.unit_indices as text}", "--attempt=${input.attempt}" ]
      timeout: 60s
      output: ${result.stdout as json}

  - id: render-save
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_step, save, "--job=${input.job_dir}", "--unit=${input.unit_index}", "--attempt=${input.attempt}" ]
      stdin: ${input.audio}
      timeout: 60s
      output: ${result.stdout as json}

  - id: render-cut
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_step, cut, "--job=${input.job_dir}", "--unit=${input.unit_index}", "--attempt=${input.attempt}", "--texts=${input.texts as text}" ]
      timeout: 60s
      output: ${result.stdout as json}

  - id: render-segments
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_step, segments, "--job=${input.job_dir}", "--unit=${input.unit_index}", "--attempt=${input.attempt}", "--vad=${input.vad as text}" ]
      timeout: 120s
      output: ${result.stdout as json}

  - id: render-qc
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_step, qc, "--job=${input.job_dir}", "--unit=${input.unit_index}", "--attempt=${input.attempt}", "--texts=${input.texts as text}" ]
      timeout: 60s
      output: ${result.stdout as json}

  # check-clip의 측정 단계. spike.run_voice_measure를 SPIKE_PYTHON으로 부른다.
  - id: voice-measure
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_voice_measure ]
      # 업로드는 stdin(`as file`)으로 넘긴다. 명령 문자열 안에서는 경로로 바뀌지 않는다.
      stdin: ${input.audio_path as file}
      timeout: 120s
      output: ${result.stdout as json}

  # render-story·render-result·render-cleanup의 단계. spike.run_render_story를 SPIKE_PYTHON으로 부른다.
  # 작업 폴더 루트와 render-unit 주소는 환경변수로만 정한다. 요청은 잡 id(UUID)만 받는다.
  # cancel은 직속 자식에게만 SIGKILL을 보내므로 sh -c로 감싸지 않는다.
  # timeout은 워커의 시간 초과(30분)보다 조금 길다.
  - id: render-story
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_story, start, "--root=${env.RENDER_JOBS_DIR | render-jobs-dir-not-set}", "--compose-url=${env.RENDER_COMPOSE_URL | render-compose-url-not-set}", "--job-id=${input.job_id}" ]
      stdin: ${input.bundle as file}
      timeout: 35m
      output: ${result.stdout as json}

  - id: render-pack
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_story, result, "--root=${env.RENDER_JOBS_DIR | render-jobs-dir-not-set}", "--job-id=${input.job_id}" ]
      timeout: 120s
      output: ${result.stdout as json}

  - id: render-cleanup
    type: shell
    action:
      command: [ "${env.SPIKE_PYTHON | spike-python-not-set}", -m, spike.run_render_story, cleanup, "--root=${env.RENDER_JOBS_DIR | render-jobs-dir-not-set}", "--job-id=${input.job_id}" ]
      timeout: 120s
      output: ${result.stdout as json}

  - id: render-attempt-flow
    type: workflow
    action:
      workflow: render-attempt

  - id: render-take-flow
    type: workflow
    action:
      workflow: render-take
